<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23c9a227'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<noscript>
  <!-- Without JS the envelope can never be opened, so skip straight to the card. -->
  <style>
    #p05 .sd__cover{ display:none !important; }
    #p05 .sd__stage,
    #p05 .sd__line{ opacity:1 !important; transform:none !important; }
  </style>
</noscript>
</head>
<body>

<main class="deck">

  <!-- ============ 0.5 · SAVE THE DATE (envelope + zoom reveal) ============ -->
  <!-- Opens closed. Tapping the seal opens the flap, the cover fades away and
       the card zooms down into place, then the lines stagger in. Nothing
       scrolls. Edit the text below — add or remove a <p class="sd__line">
       and the cadence re-indexes itself. -->
  <section class="page sd-ready" id="p05" data-no-reveal>
    <div class="frame">
      <div class="slot slot--bg slot--optional" data-slot="p05-bg.jpg"><img fetchpriority="high" decoding="async" src="assets/img/p4-bg.jpg" alt=""></div>

      <!-- what gets revealed -->
      <div class="sd__stage">
        <div class="slot slot--fit slot--optional sd__floral" data-slot="p05-floral.png"><img decoding="async" src="assets/img/p8-floral.png" alt=""></div>
        <div class="frame__body sd" data-savedate>
          <p class="sd__line sd__eyebrow">Save <em>the</em> Date</p>
          <p class="sd__line sd__names">Vanchhay<span class="sd__heart">&#9825;</span>Somanita</p>
          <p class="sd__line sd__caps">Join us for our special day</p>
          <p class="sd__line sd__body">Sunday 22<sup>nd</sup> November 2026</p>
          <p class="sd__line sd__body">Pech Chet Restaurant<br>Dam Dek, Siem Reap</p>
          <p class="sd__line sd__closing">With love, Will & Losie</p>
        </div>
      </div>

      <!-- the cover: sits on top until opened -->
      <div class="sd__cover">
        <button class="envelope" type="button" data-envelope aria-label="Open invitation">
          <span class="envelope__back"></span>
          <!-- <span class="slot slot--fit envelope__card" data-slot="p0-card-1.png"><img fetchpriority="high" decoding="async" src="assets/img/p0-card-1.png" alt=""></span> -->
          <span class="envelope__front"></span>
          <span class="envelope__flap"></span>
          <span class="envelope__seal">
            <img fetchpriority="high" decoding="async" src="assets/img/p0-seal.png" alt="">
            <!-- <span class="slot slot--fit slot--optional envelope__monogram" data-slot="p0-seal.png"><img decoding="async" src="assets/img/p0-seal.png" alt=""></span> -->
          </span>
        </button>
        <span class="intro__hint" aria-hidden="true"></span>
      </div>
    </div>
  </section>

  <!-- ============ 1 · INVITATION ============ -->
  <section class="page" id="p1">
    <div class="frame">
      <div class="slot slot--bg" data-slot="p1-bg.jpg"><img loading="lazy" decoding="async" src="assets/img/p1-bg.jpg" alt=""></div>
      <div class="frame__body body--center">
        <div class="slot slot--fit p1__card" data-slot="p1-content.png"><img loading="lazy" decoding="async" src="assets/img/p1-content.png" alt=""></div>
      </div>
    </div>
  </section>

  <!-- ============ 2 · AGENDA ============ -->
  <section class="page" id="p2">
    <div class="frame">
      <div class="slot slot--bg" data-slot="p2-bg.jpg"><img loading="lazy" decoding="async" src="assets/img/p2-bg.jpg" alt=""></div>
      <div class="frame__body body--center">
        <div class="slot slot--fit p2__card" data-slot="p2-content.png"><img loading="lazy" decoding="async" src="assets/img/p2-content.png" alt=""></div>
      </div>
    </div>
  </section>


  <!-- ============ 3 · Location ============ -->
  <section class="page" id="p3">
    <div class="frame">
      <div class="slot slot--bg" data-slot="p3-bg.jpg"><img loading="lazy" decoding="async" src="assets/img/p2-bg.jpg" alt=""></div>
      <div class="frame__body body--center">
        <a class="p3__tap" href="#" data-map-link>
          <div class="slot slot--fit p3__card" data-slot="p3-content.png"><img loading="lazy" decoding="async" src="assets/img/p3-content.png" alt=""></div>
        </a>
      </div>
    </div>
  </section>

  <!-- ============ 3 · LOCATION ============ -->
  <!-- <section class="page" id="p3">
    <div class="frame">
      <div class="slot slot--bg" data-slot="p3-bg.jpg"><img loading="lazy" decoding="async" src="assets/img/p3-bg.png" alt=""></div>
      <div class="frame__body p3__stack">
        <div class="slot slot--fit p3__heading" data-slot="p3-heading.png"><img loading="lazy" decoding="async" src="assets/img/p3-heading.png" alt=""></div>
        <div class="slot slot--fit p3__map" data-slot="p3-map.png"><img loading="lazy" decoding="async" src="assets/img/p3-map.png" alt=""></div>
        <a class="p3__link" href="#" data-map-link>
          <div class="slot slot--fit p3__cta" data-slot="p3-cta.png"><img loading="lazy" decoding="async" src="assets/img/p3-cta.png" alt=""></div>
        </a>
        <div class="slot slot--fit p3__qr" data-slot="p3-qr.png"><img loading="lazy" decoding="async" src="assets/img/p3-qr.png" alt=""></div>
      </div>
    </div>
  </section> -->

  <!-- ============ 4 · COUNTDOWN ============ -->
  <section class="page" id="p4">
    <div class="frame">
      <div class="slot slot--bg" data-slot="p4-bg.jpg"><img loading="lazy" decoding="async" src="assets/img/p4-bg.jpg" alt=""></div>
      <div class="frame__body p4__stack">

        <div class="p4__strip">
          <div class="slot p4__photo" data-slot="p4-photo-1.jpg"><img loading="lazy" decoding="async" src="assets/img/p4-photo-1.jpg" alt=""></div>
          <div class="slot p4__photo" data-slot="p4-photo-2.jpg"><img loading="lazy" decoding="async" src="assets/img/p4-photo-2.jpg" alt=""></div>
          <div class="slot p4__photo" data-slot="p4-photo-3.jpg"><img loading="lazy" decoding="async" src="assets/img/p4-photo-3.jpg" alt=""></div>

          <div class="countdown" data-countdown>
            <div class="countdown__unit"><span class="countdown__num" data-cd="days">--</span><span class="countdown__label">DAYS</span></div>
            <span class="countdown__sep">:</span>
            <div class="countdown__unit"><span class="countdown__num" data-cd="hours">--</span><span class="countdown__label">HOURS</span></div>
            <span class="countdown__sep">:</span>
            <div class="countdown__unit"><span class="countdown__num" data-cd="minutes">--</span><span class="countdown__label">MINUTES</span></div>
            <span class="countdown__sep">:</span>
            <div class="countdown__unit"><span class="countdown__num" data-cd="seconds">--</span><span class="countdown__label">SECONDS</span></div>
          </div>
        </div>

        <div class="slot slot--fit p4__tagline" data-slot="p4-tagline.png"><img loading="lazy" decoding="async" src="assets/img/p4-tagline.png" alt=""></div>
        <div class="slot slot--fit p4__card" data-slot="p4-content.png"><img loading="lazy" decoding="async" src="assets/img/p4-content.png" alt=""></div>
      </div>
    </div>
  </section>

  <!-- ============ 5 · GALLERY A ============ -->
  <section class="page" id="p5">
    <div class="frame frame--plain">
      <div class="slot slot--bg" data-slot="p5-bg.jpg"><img loading="lazy" decoding="async" src="assets/img/p4-bg.jpg" alt=""></div>
      <div class="frame__body p5__stack">
        <div class="slot slot--fit p5__heading" data-slot="p5-heading.png"><img loading="lazy" decoding="async" src="assets/img/p5-heading.png" alt=""></div>
        <div class="slot p5__photo" data-slot="p5-photo-1.jpg"><img loading="lazy" decoding="async" src="assets/img/p5-photo-1-1.jpg" alt=""></div>
        <div class="slot p5__photo" data-slot="p5-photo-2.jpg"><img loading="lazy" decoding="async" src="assets/img/p5-photo-2.jpg" alt=""></div>
      </div>
    </div>
  </section>

  <!-- ============ 6 · GALLERY B ============ -->
  <section class="page" id="p6">
    <div class="frame frame--plain">
      <div class="slot slot--bg" data-slot="p6-bg.jpg"><img loading="lazy" decoding="async" src="assets/img/p4-bg.jpg" alt=""></div>
      <div class="frame__body p6__grid">
        <div class="slot g6-a" data-slot="p6-photo-1.jpg"><img loading="lazy" decoding="async" src="assets/img/p6-photo-1.jpg" alt=""></div>
        <div class="slot g6-b" data-slot="p6-photo-2.jpg"><img loading="lazy" decoding="async" src="assets/img/p6-photo-2.jpg" alt=""></div>
        <div class="slot g6-c" data-slot="p6-photo-3.jpg"><img loading="lazy" decoding="async" src="assets/img/p6-photo-3.jpg" alt=""></div>
        <div class="slot g6-d" data-slot="p6-photo-4.jpg"><img loading="lazy" decoding="async" src="assets/img/p6-photo-4.jpg" alt=""></div>
        <div class="slot g6-e" data-slot="p6-photo-5.jpg"><img loading="lazy" decoding="async" src="assets/img/p6-photo-5.jpg" alt=""></div>
      </div>
    </div>
  </section>

  <!-- ============ 7 · GALLERY C ============ -->
  <section class="page" id="p7">
    <div class="frame frame--plain">
      <div class="frame__body p7__grid">
        <div class="slot g7-a" data-slot="p7-photo-1.jpg"><img loading="lazy" decoding="async" src="assets/img/p7-photo-1.jpg" alt=""></div>
        <div class="slot g7-b" data-slot="p7-photo-2.jpg"><img loading="lazy" decoding="async" src="assets/img/p7-photo-2.jpg" alt=""></div>
        <div class="slot g7-c" data-slot="p7-photo-3.jpg"><img loading="lazy" decoding="async" src="assets/img/p7-photo-3-1.jpg" alt=""></div>
        <div class="slot g7-d" data-slot="p7-photo-4.jpg"><img loading="lazy" decoding="async" src="assets/img/p7-photo-4.jpg" alt=""></div>
        <div class="slot g7-e" data-slot="p7-photo-5.jpg"><img loading="lazy" decoding="async" src="assets/img/p7-photo-5.jpg" alt=""></div>
      </div>
    </div>
  </section>

  <!-- ============ 8 · THANK YOU ============ -->
  <section class="page" id="p8">
    <div class="frame">
      <div class="slot slot--bg" data-slot="p8-bg.jpg"><img loading="lazy" decoding="async" src="assets/img/p4-bg.jpg" alt=""></div>
      <div class="slot slot--fit p8__floral" data-slot="p8-floral.png"><img loading="lazy" decoding="async" src="assets/img/p8-floral.png" alt=""></div>
      <div class="frame__body body--center">
        <div class="slot slot--fit p8__card" data-slot="p8-content.png"><img loading="lazy" decoding="async" src="assets/img/p8-content-1.png" alt=""></div>
      </div>
    </div>
  </section>

</main>

<!-- Ambient petals and shimmer. One canvas for the whole site rather than
     dozens of animated DOM nodes — 30-odd particles on a single compositor
     layer instead of 30 layers. Purely decorative, never takes a click. -->
<canvas class="ambient" data-ambient aria-hidden="true"></canvas>

<!-- Music toggle. Stays hidden unless a track in TRACKS (js/app.js) actually
     loads, so the site is unchanged if you never add audio. -->
<button class="music" type="button" data-music aria-label="Toggle music" hidden>
  <span class="music__bars" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<script src="js/app.js"></script>
</body>
</html>
